# Temporary HTTP-only site used ONLY to issue the first certificate.
# Install as /etc/nginx/sites-available/wiki.conf, issue the certificate,
# then replace it with nginx/wiki.conf (see RUNBOOK.md).

server {
    listen 80;
    listen [::]:80;
    server_name wiki.closetrepublic.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "wiki bootstrap\n";
        add_header Content-Type text/plain;
    }
}
