# /etc/nginx/sites-available/wiki.conf
# Reverse proxy for Wiki.js (published on 127.0.0.1:40010).
# The certificate files must exist before this file is enabled.
# First-time order is in RUNBOOK.md (use wiki-bootstrap.conf first).

# Keep the WebSocket upgrade mapping local to this site.
map $http_upgrade $wiki_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name wiki.closetrepublic.com;

    # Let's Encrypt HTTP-01 challenge (webroot mode)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wiki.closetrepublic.com;

    ssl_certificate     /etc/letsencrypt/live/wiki.closetrepublic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wiki.closetrepublic.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:WikiSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Asset uploads
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:40010;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket pass-through
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $wiki_connection_upgrade;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
